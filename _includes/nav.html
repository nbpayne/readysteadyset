<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <a href="{{ '/' | relative_url }}" class="nav-logo" aria-label="{{ site.title }} - Home">
    <img 
      src="{{ '/assets/images/rss-logo.jpg' | relative_url }}" 
      alt="{{ site.title }}"
      width="120"
      height="48"
      class="loaded"
    />
  </a>

  <ul class="nav-links" role="list">
    <!-- Home only shown in mobile menu (logo serves as home on desktop) -->
    <li class="nav-home-item">
      {% assign home_url = '/' | relative_url %}
      <a href="{{ home_url }}" class="nav-link{% if page.url == home_url %} active{% endif %}">Home</a>
    </li>
    {% for link in site.nav_links %}
    <li>
      {% assign link_url = link.url | relative_url %}
      <a 
        href="{{ link_url }}" 
        class="nav-link{% if page.url == link_url %} active{% endif %}"
      >{{ link.title }}</a>
    </li>
    {% endfor %}
    <li>
      <a href="{{ '/contact/' | relative_url }}" class="nav-cta">Book a Call</a>
    </li>
  </ul>

  <button 
    class="nav-toggle" 
    aria-label="Toggle menu" 
    aria-expanded="false"
    aria-controls="nav-links"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>
